[build]
  publish = "."

# Single page — everything routes to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # connect-src 'self' means a script injected into the page still has nowhere
    # to send your data. frame-ancestors blocks clickjacking of the unlock form.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# The worker itself must never be served from cache, or a redeploy can't land.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
