<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message sent — Claudia Ramstedt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23F8D7DC'/><text y='72' x='50' text-anchor='middle' font-size='48' font-family='Georgia,serif' font-weight='700' fill='%23c47a8a'>CR</text></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FAF7F2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 0.75rem; color: #2A2A2A; }
    p { color: #7A6E6A; line-height: 1.7; margin-bottom: 2rem; }
    a {
      display: inline-block;
      background: #F8D7DC;
      color: #2A2A2A;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 100px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌸</div>
    <h1>Message sent!</h1>
    <p>Thank you for reaching out! I'll get back to you within 24 hours.</p>
    <a href="/">Back to portfolio</a>
  </div>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
