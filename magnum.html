<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapshots from Magnum Campaign — Claudia Ramstedt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23F8D7DC'/><text y='72' x='50' text-anchor='middle' font-size='48' font-family='Georgia,serif' font-weight='700' fill='%23c47a8a'>CR</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C8961E;
      --gold-light: #F5E6B8;
      --gold-pale: #FDF6E3;
      --gold-dark: #8B6914;
      --cream: #FFFBF0;
      --dark: #2A1F00;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
    }

    /* NAV */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 5%;
      background: rgba(255, 251, 240, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gold-light);
    }

    .nav-logo { display: flex; flex-direction: column; line-height: 1.1; text-decoration: none; }
    .nav-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: var(--dark); }
    .nav-sub { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--gold-dark);
      text-decoration: none;
      padding: 8px 16px;
      border: 1.5px solid var(--gold-light);
      border-radius: 100px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: var(--gold-light); }

    /* HERO */
    .page-hero {
      padding: 9rem 5% 4rem;
      text-align: center;
      background: linear-gradient(180deg, var(--gold-pale) 0%, var(--cream) 100%);
    }

    .campaign-tag {
      display: inline-block;
      background: var(--gold-light);
      color: var(--gold-dark);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 1.2rem;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--dark);
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .page-title em {
      font-style: italic;
      color: var(--gold);
    }

    .page-sub {
      color: #7A6030;
      font-size: 0.95rem;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* GRID */
    .gallery {
      padding: 3rem 5% 6rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .media-card {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 30px rgba(200, 150, 30, 0.15);
      background: var(--gold-pale);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .media-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 40px rgba(200, 150, 30, 0.25);
    }

    .media-card video,
    .media-card img {
      width: 100%;
      display: block;
      aspect-ratio: 9/16;
      object-fit: cover;
      border-radius: 20px;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 2rem;
      color: #A08040;
      font-size: 0.78rem;
      border-top: 1px solid var(--gold-light);
    }

    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav-logo">
      <span class="nav-name">Claudia Ramstedt</span>
      <span class="nav-sub">UGC Portfolio</span>
    </a>
    <a href="/#work" class="back-btn">← Back to portfolio</a>
  </nav>

  <div class="page-hero">
    <div class="campaign-tag">Campaign · Magnum</div>
    <h1 class="page-title">Snapshots from<br><em>Magnum Campaign</em></h1>
    <p class="page-sub">Behind-the-scenes and content snippets from the Magnum collaboration.</p>
  </div>

  <div class="gallery">
    <div class="gallery-grid">
      <div class="media-card">
        <video src="assets/magnum1.mp4" autoplay loop muted playsinline></video>
      </div>
      <div class="media-card">
        <img src="assets/IMG_8388.jpg" alt="Magnum campaign snapshot" />
      </div>
      <div class="media-card">
        <video src="assets/magnum2.mp4" autoplay loop muted playsinline></video>
      </div>
      <div class="media-card">
        <video src="assets/magnum3.mp4" autoplay loop muted playsinline></video>
      </div>
      <div class="media-card">
        <img src="assets/IMG_8526.jpg" alt="Magnum campaign snapshot" />
      </div>
    </div>
  </div>

  <footer class="footer">
    &copy; 2025 Claudia Ramstedt. All rights reserved.
  </footer>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
