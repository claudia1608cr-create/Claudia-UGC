[build]
  publish = "."

# The collab CRM is a separate app with its own deploy (see crm-app/README.md).
# This publish directory is the whole repo, so shadow the folder with a forced
# 404 — otherwise the portfolio domain would serve the CRM too. `force` is what
# makes the rule win over the files that are actually there.
[[redirects]]
  from = "/crm-app/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
